<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif; }
    a { color: #7C5CFF; } a:hover { color: #5C3CE0; }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #F4F1FA; display: flex; flex-direction: column; color: #2A2340; padding: 18px 22px 20px;">

  <!-- top bar -->
  <div style="display: flex; align-items: center; gap: 16px;">
    <div style="width: 56px; height: 56px; border-radius: 18px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2A2340" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="font-size: 24px; font-weight: 800;">Намалюй сонечко</div>
      <div style="font-size: 16px; font-weight: 700; color: #8B84A3;">Крок 2 із 6</div>
      <div style="display: flex; gap: 7px;">
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #7C5CFF;"></div>
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #7C5CFF;"></div>
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #DCD7EA;"></div>
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #DCD7EA;"></div>
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #DCD7EA;"></div>
        <div style="width: 34px; height: 8px; border-radius: 999px; background: #DCD7EA;"></div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 10px 18px 10px 12px; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFC53D"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg>
      <span style="font-size: 19px; font-weight: 800;">120</span>
    </div>

    <div style="width: 56px; height: 56px; border-radius: 18px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B84A3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6.5 10.5V20h11v-9.5"/></svg>
    </div>
  </div>

  <!-- body -->
  <div style="flex-grow: 1; display: flex; gap: 18px; padding-top: 16px;">

    <!-- toolbar -->
    <div style="display: flex; flex-direction: column; gap: 12px; background: #fff; border-radius: 26px; padding: 14px; box-shadow: 0 6px 18px rgba(60,40,120,.08); align-self: flex-start;">
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #7C5CFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(124,92,255,.35);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L8 20H4v-4z"/><path d="M13.5 6.5l4 4"/></svg>
      </div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-8 8-4-4z"/><path d="M9 11c-3 1-4 4-4 6 2 0 5-1 6-4z"/></svg>
      </div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l9 9-7 7-9-9z"/><path d="M20 15c1.2 1.6 1.8 2.7 1.8 3.4A1.9 1.9 0 0120 20.3 1.9 1.9 0 0118.2 18.4c0-.7.6-1.8 1.8-3.4z"/></svg>
      </div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20l-4-4 10-10 4 4-8 8z"/><path d="M8 20h11"/></svg>
      </div>
      <div style="height: 2px; background: #EFEBF6; border-radius: 999px; margin: 2px 6px;"></div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <div style="width: 36px; height: 36px; border-radius: 999px; background: #E4443B; border: 3px solid #fff; box-shadow: 0 0 0 3px #E4443B;"></div>
      </div>
      <div style="height: 2px; background: #EFEBF6; border-radius: 999px; margin: 2px 6px;"></div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#5C5478" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h10a5 5 0 010 10h-3"/><path d="M8 5L4 9l4 4"/></svg>
      </div>
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #F4F1FA; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C8C2DA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9H10a5 5 0 000 10h3"/><path d="M16 5l4 4-4 4"/></svg>
      </div>
    </div>

    <!-- canvas -->
    <div style="flex-grow: 1; background: #fff; border-radius: 30px; box-shadow: 0 6px 22px rgba(60,40,120,.08); display: flex; align-items: center; justify-content: center; position: relative;">
      <svg width="430" height="400" viewBox="0 0 400 380">
        <g stroke="#B8B2CC" stroke-width="3" fill="none" stroke-dasharray="9 9" stroke-linecap="round">
          <ellipse cx="200" cy="205" rx="128" ry="122"/>
          <circle cx="200" cy="92" r="52"/>
          <path d="M178 52 L152 20"/><circle cx="149" cy="16" r="9"/>
          <path d="M222 52 L248 20"/><circle cx="251" cy="16" r="9"/>
          <path d="M200 84 L200 327"/>
          <path d="M78 150 L36 128"/><path d="M72 205 L26 205"/><path d="M80 262 L38 286"/>
          <path d="M322 150 L364 128"/><path d="M328 205 L374 205"/><path d="M320 262 L362 286"/>
          <circle cx="255" cy="155" r="20"/><circle cx="292" cy="222" r="17"/><circle cx="240" cy="252" r="18"/>
        </g>
        <path d="M200 84 A128 122 0 0 0 200 327" fill="none" stroke="#E4443B" stroke-width="8" stroke-linecap="round"/>
        <g fill="#2A2340">
          <circle cx="145" cy="155" r="20"/><circle cx="108" cy="222" r="17"/><circle cx="160" cy="252" r="18"/><circle cx="122" cy="292" r="14"/>
        </g>
      </svg>

      <div style="position: absolute; left: 24px; top: 22px; display: flex; align-items: center; gap: 10px; background: #F4F1FA; border-radius: 999px; padding: 10px 18px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7C5CFF" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
        <span style="font-size: 16px; font-weight: 700; color: #5C5478;">Обведи ліве крильце</span>
      </div>
    </div>

    <!-- next -->
    <div style="width: 148px; display: flex; flex-direction: column; justify-content: flex-end;">
      <div style="height: 132px; border-radius: 30px; background: #7C5CFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 26px rgba(124,92,255,.38);">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 6l6 6-6 6"/></svg>
        <div style="font-size: 20px; font-weight: 800; color: #fff;">Далі</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
