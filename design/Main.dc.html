<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, "Trebuchet MS", "Segoe UI", sans-serif; }
    a { color: #7C5CFF; } a:hover { color: #5C3CE0; }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; box-sizing: border-box; background: #F4F1FA; display: flex; flex-direction: column; color: #2A2340;">

  <!-- header -->
  <div style="display: flex; align-items: center; gap: 16px; padding: 20px 28px 8px;">
    <div style="display: flex; align-items: center; gap: 10px; flex-grow: 1;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #7C5CFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(124,92,255,.35);">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L8 20H4v-4z"/><path d="M13.5 6.5l4 4"/></svg>
      </div>
      <div style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Drawli</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 999px; padding: 10px 18px 10px 12px; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFC53D"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg>
      <span style="font-size: 20px; font-weight: 800;">120</span>
    </div>

    <div style="width: 56px; height: 56px; border-radius: 18px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B84A3" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.56V21a2 2 0 11-4 0v-.11a1.7 1.7 0 00-1.11-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.56-1H3a2 2 0 110-4h.11a1.7 1.7 0 001.56-1.11 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.56V3a2 2 0 114 0v.11a1.7 1.7 0 001 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.56 1H21a2 2 0 110 4h-.11a1.7 1.7 0 00-1.56 1z"/></svg>
    </div>
  </div>

  <!-- resume strip -->
  <div style="margin: 6px 28px 0; display: flex; align-items: center; gap: 16px; background: #EFEBFF; border: 2px solid #DCD3FF; border-radius: 22px; padding: 12px 14px;">
    <div style="width: 52px; height: 52px; border-radius: 16px; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg width="34" height="34" viewBox="0 0 40 40"><ellipse cx="20" cy="22" rx="14" ry="13" fill="#E4443B"/><circle cx="20" cy="9" r="6" fill="#2A2340"/><path d="M20 9v26" stroke="#2A2340" stroke-width="2"/><circle cx="13" cy="18" r="2.6" fill="#2A2340"/><circle cx="27" cy="20" r="2.6" fill="#2A2340"/><circle cx="15" cy="27" r="2.4" fill="#2A2340"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-size: 17px; font-weight: 800;">Продовжити малювати?</div>
      <div style="font-size: 15px; color: #6C6390; font-weight: 600;">Сонечко · крок 4 із 6</div>
    </div>
    <div style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 26px; border-radius: 16px; background: #7C5CFF; color: #fff; font-size: 17px; font-weight: 800; box-shadow: 0 6px 16px rgba(124,92,255,.35);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5l12 7-12 7z"/></svg>
      Продовжити
    </div>
  </div>

  <!-- title + categories -->
  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 28px 12px;">
    <div style="font-size: 24px; font-weight: 800; flex-grow: 1;">Що будемо малювати сьогодні?</div>
    <div style="display: flex; gap: 8px;">
      <div style="height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 999px; background: #7C5CFF; color: #fff; font-size: 16px; font-weight: 700;">Усі</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 999px; background: #fff; color: #6C6390; font-size: 16px; font-weight: 700;">Моторика</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 999px; background: #fff; color: #6C6390; font-size: 16px; font-weight: 700;">Фігури</div>
      <div style="height: 44px; display: flex; align-items: center; padding: 0 20px; border-radius: 999px; background: #fff; color: #6C6390; font-size: 16px; font-weight: 700;">Тварини</div>
    </div>
  </div>

  <!-- grid -->
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding: 0 28px;">

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative;">
      <div style="position: absolute; top: 12px; right: 14px; display: flex; gap: 2px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#FFC53D"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/></svg></div>
      <svg width="74" height="74" viewBox="0 0 40 40"><path d="M20 4l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L20 27.6l-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z" fill="#FFC53D"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Зірка</div>
    </div>

    <div style="background: #fff; border-radius: 26px; border: 3px solid #7C5CFF; box-shadow: 0 10px 24px rgba(124,92,255,.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative;">
      <div style="position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 999px; background: #34C77B; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
      </div>
      <svg width="74" height="74" viewBox="0 0 40 40"><ellipse cx="20" cy="22" rx="14" ry="13" fill="#E4443B"/><circle cx="20" cy="9" r="6" fill="#2A2340"/><path d="M20 9v26" stroke="#2A2340" stroke-width="2"/><circle cx="13" cy="18" r="2.6" fill="#2A2340"/><circle cx="27" cy="20" r="2.6" fill="#2A2340"/><circle cx="15" cy="27" r="2.4" fill="#2A2340"/><circle cx="26" cy="28" r="2.2" fill="#2A2340"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Сонечко</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><path d="M20 6l15 12H5z" fill="#E4685B"/><rect x="9" y="18" width="22" height="15" rx="3" fill="#F6C15B"/><rect x="17" y="24" width="7" height="9" rx="2" fill="#8B5E3C"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Будинок</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><circle cx="20" cy="10" r="6.5" fill="#8FA9F0"/><circle cx="30" cy="20" r="6.5" fill="#8FA9F0"/><circle cx="20" cy="30" r="6.5" fill="#8FA9F0"/><circle cx="10" cy="20" r="6.5" fill="#8FA9F0"/><circle cx="20" cy="20" r="6" fill="#FFC53D"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Квітка</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><path d="M20 12c4-5 15-3 15 8 0 9-7 15-10 15-2 0-3-1-5-1s-3 1-5 1c-3 0-10-6-10-15 0-11 11-13 15-8z" fill="#E4443B"/><path d="M20 12c0-4 2-6 5-7-1 4-2 6-5 7z" fill="#4EA55F"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Яблуко</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><rect x="3" y="18" width="34" height="10" rx="4" fill="#6FA8F5"/><path d="M9 18l4-6h14l4 6z" fill="#8FC0FA"/><circle cx="12" cy="29" r="4.5" fill="#2A2340"/><circle cx="28" cy="29" r="4.5" fill="#2A2340"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Машина</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><circle cx="20" cy="20" r="9" fill="#FFC53D"/><g stroke="#FFC53D" stroke-width="3.2" stroke-linecap="round"><path d="M20 3v5M20 32v5M3 20h5M32 20h5M8 8l3.5 3.5M28.5 28.5L32 32M32 8l-3.5 3.5M11.5 28.5L8 32"/></g></svg>
      <div style="font-size: 18px; font-weight: 800;">Сонце</div>
    </div>

    <div style="background: #fff; border-radius: 26px; box-shadow: 0 6px 18px rgba(60,40,120,.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <svg width="74" height="74" viewBox="0 0 40 40"><ellipse cx="18" cy="20" rx="13" ry="9" fill="#5FC7C0"/><path d="M31 20l7-6v12z" fill="#5FC7C0"/><circle cx="12" cy="18" r="2" fill="#2A2340"/></svg>
      <div style="font-size: 18px; font-weight: 800;">Рибка</div>
    </div>
  </div>

  <!-- bottom nav -->
  <div style="display: flex; justify-content: center; gap: 12px; padding: 18px 28px 20px;">
    <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-radius: 22px; background: #7C5CFF; color: #fff; font-size: 18px; font-weight: 800; box-shadow: 0 8px 20px rgba(124,92,255,.32);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L8 20H4v-4z"/></svg>
      Малюю
    </div>
    <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-radius: 22px; background: #fff; color: #6C6390; font-size: 18px; font-weight: 800; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B84A3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>
      Мої малюнки
    </div>
    <div style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 30px; border-radius: 22px; background: #fff; color: #6C6390; font-size: 18px; font-weight: 800; box-shadow: 0 4px 14px rgba(60,40,120,.08);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#8B84A3" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3.5l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 18.45 6.2 21.4l1.1-6.45-4.7-4.6 6.5-.95z"/></svg>
      Прогрес
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
